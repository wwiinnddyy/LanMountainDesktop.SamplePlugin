name: Probe feed auth

# 一次性探针：验证消费方工作流自带的 GITHUB_TOKEN 能否还原 GitHub Packages 上的 SDK。
# 结论拿到后删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: HTTP probe
        shell: bash
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          url="https://nuget.pkg.github.com/wwiinnddyy/download/LanMountainDesktop.AirAppSdk/1.0.1/LanMountainDesktop.AirAppSdk.1.0.1.nupkg"
          echo "token_length=${#TOK}"
          echo "x-access-token: $(curl -s -o /dev/null -w '%{http_code}\n' -u "x-access-token:$TOK" -L "$url")"
          echo "github-actions: $(curl -s -o /dev/null -w '%{http_code}\n' -u "github-actions:$TOK" -L "$url")"
          echo "actor:          $(curl -s -o /dev/null -w '%{http_code}\n' -u "$ACTOR:$TOK" -L "$url")"

      - name: Restore with GITHUB_TOKEN
        shell: bash
        env:
          LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
          LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "global-packages folder tracked in git? $(git ls-files .nuget | wc -l) files"
          dotnet restore LanMountainDesktop.SamplePlugin.csproj
          echo "restore_exit=$?"
          ls .nuget/packages/lanmountaindesktop.airappsdk 2>/dev/null | sed 's/^/cached_sdk_versions=/'

      # 反证：同一份 NuGet.config、换一个假 token，必须红。
      # 红不了就说明上面那次绿不是 GITHUB_TOKEN 起的作用（比如包其实来自本地源）。
      - name: Negative control - bogus token must fail
        shell: bash
        env:
          LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
          LANMOUNTAIN_PACKAGES_TOKEN: bogus-not-a-token
        run: |
          rm -rf .nuget/packages/lanmountaindesktop.airappsdk
          out="$(dotnet restore LanMountainDesktop.SamplePlugin.csproj 2>&1)" && rc=0 || rc=$?
          echo "$out" | grep -E "NU[0-9]+" | head -5 | sed 's/^/bogus: /'
          if [ "$rc" -eq 0 ]; then
            echo "::error::假 token 也能还原——上面那次绿不能归因给 GITHUB_TOKEN"
            exit 1
          fi
          echo "bogus_restore_failed_as_expected exit=$rc"
