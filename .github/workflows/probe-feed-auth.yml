name: Probe feed auth

# 一次性探针：验证消费方工作流自带的 GITHUB_TOKEN 能否还原 GitHub Packages 上的 SDK。
# 结论拿到后删除本文件。

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: HTTP probe
        shell: bash
        env:
          TOK: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          url="https://nuget.pkg.github.com/wwiinnddyy/download/LanMountainDesktop.AirAppSdk/1.0.1/LanMountainDesktop.AirAppSdk.1.0.1.nupkg"
          echo "token_length=${#TOK}"
          echo "x-access-token: $(curl -s -o /dev/null -w '%{http_code}' -u "x-access-token:$TOK" -L "$url")"
          echo "github-actions: $(curl -s -o /dev/null -w '%{http_code}' -u "github-actions:$TOK" -L "$url")"
          echo "actor:          $(curl -s -o /dev/null -w '%{http_code}' -u "$ACTOR:$TOK" -L "$url")"
          echo "anonymous:      $(curl -s -o /dev/null -w '%{http_code}' -L "$url")"

      # 反证先跑：假 token + 全新包目录 + --no-cache，必须红。
      # （第二版探针把它放在绿的那次之后，结果 281ms 就 "Restored" 了——NuGet 的 http-cache
      #  把包从缓存里解出来，根本没碰源，于是红不起来。顺序与缓存隔离两个都得占。）
      - name: Negative control - bogus token must fail
        shell: bash
        env:
          LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
          LANMOUNTAIN_PACKAGES_TOKEN: bogus-not-a-token
        run: |
          if dotnet restore LanMountainDesktop.SamplePlugin.csproj --packages /tmp/pkg-bogus --no-cache; then
            echo "::error::假 token 也能还原——GITHUB_TOKEN 那次绿不能归因给凭据"
            exit 1
          fi
          ls /tmp/pkg-bogus 2>/dev/null | sed 's/^/bogus-pkgdir: /' || true
          echo "bogus_restore_is_red_as_expected"

      - name: Restore with GITHUB_TOKEN
        shell: bash
        env:
          LANMOUNTAIN_PACKAGES_USER: ${{ github.actor }}
          LANMOUNTAIN_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "packages folder tracked in git? $(git ls-files .nuget | wc -l) files"
          dotnet restore LanMountainDesktop.SamplePlugin.csproj --packages /tmp/pkg-token --no-cache
          ls /tmp/pkg-token/lanmountaindesktop.airappsdk | sed 's/^/cached_sdk_versions=/'
